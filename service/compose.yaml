name: nco-proctor
x-app: &app
  image: nco-proctor:2026.10
  build: .
  env_file: .env
  environment: {PYTHONPATH: /opt/proctor}
  restart: unless-stopped
  volumes:
    - /data/2027nco:/data
    - ./secrets:/run/secrets:ro
    - ./tls/ca.crt:/run/tls/ca.crt:ro
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: &logging
    driver: json-file
    options: {max-size: "20m", max-file: "3"}
services:
  load-test:
    <<: *app
    profiles: [test]
    command: [python, /suite/load.py]
    restart: "no"
    mem_limit: 2g
    cpus: 4
    pids_limit: 512
    volumes:
      - /data/2027nco:/data
      - ./secrets:/run/secrets:ro
      - ./tls/ca.crt:/run/tls/ca.crt:ro
      - ./tests:/suite:ro
  api:
    <<: *app
    mem_limit: 512m
    cpus: 2
    healthcheck:
      test: [CMD, python, -m, app.cli, health]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
  worker:
    <<: *app
    command: [python, -m, app.worker]
    mem_limit: 4g
    cpus: 8
    pids_limit: 512
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -m, app.cli, health, --worker]
      interval: 20s
      timeout: 5s
      retries: 4
      start_period: 30s
  srs:
    image: ossrs/srs@sha256:5ed957dbebc48da42e928cebbc9446bced1c5afc58f816e122ce36d370af0113
    command: [./objs/srs, -c, conf/srs.conf]
    restart: unless-stopped
    user: "1001:1001"
    ports:
      - "${INGEST_BIND:-10.77.0.1}:1935:1935"
    volumes:
      - ./config/srs.conf:/usr/local/srs/conf/srs.conf:ro
      - /data/2027nco/dvr:/data/dvr
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ulimits:
      nofile: {soft: 8192, hard: 8192}
    mem_limit: 2g
    cpus: 4
    depends_on:
      api: {condition: service_healthy}
    logging: *logging
  tusd:
    image: tusproject/tusd@sha256:060f117d224d057a5f25be79b4a4535168a0901515cc20cd02f62d0b8e623f5f
    user: "1001:1001"
    command:
      - -host=0.0.0.0
      - -port=1080
      - -base-path=/uploads/
      - -upload-dir=/data/uploads
      - -behind-proxy
      - -max-size=34359738368
      - -hooks-http=http://api:8000/internal/tus
      - -hooks-enabled-events=pre-create,post-finish,pre-terminate
      - -hooks-http-retry=3
      - -hooks-http-forward-headers=Cookie,X-CSRF-Token
      - -disable-download
    restart: unless-stopped
    volumes: [/data/2027nco/uploads:/data/uploads]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    depends_on:
      api: {condition: service_healthy}
    logging: *logging
  gateway:
    image: nginx@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:18080:8080"
      - "${WEB_BIND:-127.0.0.1}:18443:8443"
      - "10.77.0.1:18443:8443"
      - "172.17.0.1:19185:8081"
    environment:
      NGINX_ENVSUBST_FILTER: PLAY_SECRET
      NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE: "1"
    env_file: .env
    volumes:
      - ./config/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./web/dist:/usr/share/nginx/html:ro
      - ./tls:/run/tls:ro
      - ./secrets/tls/server.key:/etc/nginx/tls/server.key:ro
    depends_on: [api, srs, tusd]
    mem_limit: 256m
    cpus: 2
    logging: *logging
