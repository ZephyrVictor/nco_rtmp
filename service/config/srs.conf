listen 1935;
max_connections 2048;
daemon off;
pid /tmp/srs.pid;
srs_log_tank console;
srs_log_level warn;
http_api {
    enabled on;
    listen 1985;
}
http_server {
    enabled on;
    listen 8080;
    dir /tmp;
}
vhost __defaultVhost__ {
    http_hooks {
        enabled on;
        on_publish http://api:8000/internal/srs;
        on_unpublish http://api:8000/internal/srs;
        on_play http://api:8000/internal/srs;
        on_dvr http://api:8000/internal/srs;
    }
    http_remux {
        enabled on;
        mount [vhost]/[app]/[stream].flv;
    }
    dvr {
        enabled on;
        dvr_path /data/dvr/[stream]/[2006]-[01]-[02]/[timestamp].flv;
        dvr_plan segment;
        dvr_duration 300;
        dvr_wait_keyframe on;
        time_jitter full;
    }
    publish { mr off; }
    play {
        gop_cache on;
        queue_length 10;
    }
}
